
name: Build CoercedPotato x64 Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fix Windows error constants
        shell: pwsh
        run: |
          $file = "CoercedPotato.cpp"
          $source = Get-Content $file -Raw

          $replacements = @{
            "WIN32ERR_ERROR_BAD_NETPATH" = "ERROR_BAD_NETPATH"
            "WIN32ERR_ERROR_SUCCESS" = "ERROR_SUCCESS"
            "WIN32ERR_ERROR_ACCESS_DENIED" = "ERROR_ACCESS_DENIED"
            "WIN32ERR_ERROR_NOT_SUPPORTED" = "ERROR_NOT_SUPPORTED"
          }

          foreach ($old in $replacements.Keys) {
            $source = $source.Replace($old, $replacements[$old])
          }

          Set-Content -Path $file -Value $source -Encoding utf8

      - name: Configure static runtime for Release x64
        shell: pwsh
        run: |
          $path = "CoercedPotato.vcxproj"
          [xml]$project = Get-Content $path -Raw

          $group = @($project.Project.ItemDefinitionGroup) |
            Where-Object { $_.Condition -like "*Release|x64*" } |
            Select-Object -First 1

          if ($null -eq $group) {
            throw "Release|x64 configuration not found"
          }

          $compile = $group.ClCompile

          $existing = $compile.SelectSingleNode(
            "*[local-name()='RuntimeLibrary']"
          )

          if ($null -ne $existing) {
            $existing.InnerText = "MultiThreaded"
          } else {
            $node = $project.CreateElement(
              "RuntimeLibrary",
              $project.DocumentElement.NamespaceURI
            )
            $node.InnerText = "MultiThreaded"
            [void]$compile.AppendChild($node)
          }

          $project.Save((Resolve-Path $path).Path)

          Write-Host "Release x64 runtime configured: /MT"

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild CoercedPotato.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CoercedPotato-x64-static
          path: x64/Release/CoercedPotato.exe
          if-no-files-found: error
